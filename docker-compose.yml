services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PFIS_DATABASE_URL: postgresql+psycopg://pfis:pfis@db:5432/pfis
      PFIS_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pfis
      POSTGRES_USER: pfis
      POSTGRES_PASSWORD: pfis
    volumes:
      - pfis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfis -d pfis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pfis-postgres:
